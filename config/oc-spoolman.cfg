# OpenCreator Spoolman plugin: a Spoolman spool per tool, kept by AFC.
# Included by printer.cfg through [include plugins/*.cfg] while the plugin is enabled.
#
# Each tool is an AFC lane: T0 is extruder0, T1 extruder1 and so on. AFC stores the
# spool ID of each lane. AFC doesn't make it Spoolman's active spool when the Creator 5
# picks a tool up (AFC_SELECT_TOOL, used by C5_PRINT_START, never does), so this file
# wraps C5_TOOL_SELECT, which every pickup goes through, to do that. Filament use is
# then booked on the spool that is actually printing.
#
# TOOL is optional everywhere: it defaults to the tool that is active right now, which
# in a filament start G-code is the tool that filament is printing with.
#
# Routine messages go through SPOOLMAN_ECHO, which SPOOLMAN_ECHO_ON / SPOOLMAN_ECHO_OFF
# switch. Problems are always shown: as an error when idle, and as a warning that
# doesn't stop the print while printing.

[gcode_macro SPOOLMAN_SET_TOOL]
description: Assign a Spoolman spool to a tool. SPOOLMAN_SET_TOOL SPOOL=<id> [TOOL=<0-3>] [ACTIVATE=0/1]
gcode:
  {% set active = (printer.toolhead.extruder|replace('extruder', '') or '0')|int %}
  {% set tool = params.TOOL|default(active)|int %}
  {% set spool = params.SPOOL|default(params.ID|default(0))|int %}
  {% set lane = 'extruder' ~ tool %}
  {% set activate = params.ACTIVATE|default(1 if tool == active else 0)|int %}
  {% if ('AFC_lane ' ~ lane) not in printer %}
    _SPOOLMAN_PROBLEM MSG="There is no tool {tool} (AFC lane {lane})"
  {% elif not printer.AFC.spoolman %}
    _SPOOLMAN_PROBLEM MSG="Spoolman is not set up: put its address in oc-spoolman.conf, restart Moonraker, then FIRMWARE_RESTART"
  {% else %}
    {% set current = printer['AFC_lane ' ~ lane].spool_id or 0 %}
    {% if spool > 0 %}
      # AFC refuses a spool that another lane still has, so take it off that lane first.
      {% for other in printer.AFC.lanes if other != lane and printer['AFC_lane ' ~ other].spool_id == spool %}
        SET_SPOOL_ID LANE={other} SPOOL_ID=
        SPOOLMAN_ECHO MSG="Spool {spool} taken off T{other|replace('extruder', '')}"
      {% endfor %}
    {% endif %}
    # Only look the spool up in Spoolman when it changes: the lookup holds up the
    # G-code queue, so a tool that keeps its spool costs nothing at a tool change.
    {% if current != spool %}
      SET_SPOOL_ID LANE={lane} SPOOL_ID={spool if spool > 0 else ''}
    {% endif %}
    _SPOOLMAN_SET_TOOL_DONE TOOL={tool} SPOOL={spool} ACTIVATE={activate}
  {% endif %}

# A separate macro, so it sees the lane's status after SET_SPOOL_ID has run.
[gcode_macro _SPOOLMAN_SET_TOOL_DONE]
gcode:
  {% set tool = params.TOOL|int %}
  {% set spool = params.SPOOL|int %}
  {% set now = printer['AFC_lane extruder' ~ tool].spool_id or 0 %}
  {% if now != spool %}
    _SPOOLMAN_PROBLEM MSG="Tool {tool} did not take spool {spool} (does it exist in Spoolman?). It has spool {now if now else 'none'}"
  {% else %}
    {% if params.ACTIVATE|int %}
      {action_call_remote_method("spoolman_set_active_spool", spool_id=(spool if spool > 0 else none))}
    {% endif %}
    {% if spool > 0 %}
      SPOOLMAN_ECHO MSG="Tool {tool} has spool {spool}{' (active)' if params.ACTIVATE|int else ''}"
    {% else %}
      SPOOLMAN_ECHO MSG="Tool {tool} has no spool{', no spool active' if params.ACTIVATE|int else ''}"
    {% endif %}
  {% endif %}

[gcode_macro SPOOLMAN_CLEAR_TOOL]
description: Take the Spoolman spool off a tool. SPOOLMAN_CLEAR_TOOL [TOOL=<0-3>] or ALL=1
gcode:
  {% if params.ALL|default(0)|int %}
    {% for lane in printer.AFC.lanes if lane.startswith('extruder') %}
      SPOOLMAN_SET_TOOL TOOL={lane|replace('extruder', '')} SPOOL=0
    {% endfor %}
  {% else %}
    SPOOLMAN_SET_TOOL SPOOL=0{' TOOL=' ~ params.TOOL if 'TOOL' in params else ''}
  {% endif %}

[gcode_macro SPOOLMAN_ACTIVATE_TOOL]
description: Make an assigned spool the active Spoolman spool. SPOOLMAN_ACTIVATE_TOOL [TOOL=<0-3>]
gcode:
  {% set active = (printer.toolhead.extruder|replace('extruder', '') or '0')|int %}
  {% set tool = params.TOOL|default(active)|int %}
  {% set lane = 'extruder' ~ tool %}
  {% if ('AFC_lane ' ~ lane) not in printer %}
    _SPOOLMAN_PROBLEM MSG="There is no tool {tool} (AFC lane {lane})"
  {% elif not printer.AFC.spoolman %}
    _SPOOLMAN_PROBLEM MSG="Spoolman is not set up: put its address in oc-spoolman.conf, restart Moonraker, then FIRMWARE_RESTART"
  {% else %}
    {% set spool = printer['AFC_lane ' ~ lane].spool_id %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=(spool or none))}
    {% if spool %}
      SPOOLMAN_ECHO MSG="Tool {tool}: spool {spool} active"
    {% else %}
      _SPOOLMAN_PROBLEM MSG="Tool {tool} has no spool assigned, so no spool is active and this filament is not tracked"
    {% endif %}
  {% endif %}

# Every tool pickup goes through C5_TOOL_SELECT: AFC runs it for AFC_SELECT_TOOL
# (print start) and for T0-T3 tool changes. Run the real command, then make the picked
# tool's spool active. A failed pickup raises before the second line runs.
[gcode_macro C5_TOOL_SELECT]
rename_existing: _OC_SPOOLMAN_TOOL_SELECT
description: Pick up a tool (T=0-3) and make its Spoolman spool active
gcode:
  _OC_SPOOLMAN_TOOL_SELECT {rawparams}
  _SPOOLMAN_TOOL_PICKED T={params.T|default('')}

# Never raises, so it can't stop a pickup: without AFC, Spoolman or a spool it only reports.
[gcode_macro _SPOOLMAN_TOOL_PICKED]
gcode:
  {% set t = params.T|default('')|string %}
  {% set lane = 'extruder' ~ t %}
  {% if t and 'AFC' in printer and printer.AFC.spoolman and ('AFC_lane ' ~ lane) in printer %}
    {% set spool = printer['AFC_lane ' ~ lane].spool_id %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=(spool or none))}
    {% if spool %}
      SPOOLMAN_ECHO MSG="T{t} picked up: spool {spool} active"
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
      _SPOOLMAN_PROBLEM MSG="T{t} has no spool assigned, so no spool is active and this filament is not tracked"
    {% else %}
      SPOOLMAN_ECHO MSG="T{t} picked up: it has no spool, so no spool is active"
    {% endif %}
  {% endif %}

[gcode_macro SPOOLMAN_STATUS]
description: Show each tool aligned Spoolman spool, plus the plugin settings
gcode:
  {% set vars = printer.save_variables.variables if 'save_variables' in printer else {} %}
  {% set active = (printer.toolhead.extruder|replace('extruder', '') or '0')|int %}
  {% set out = ["Spoolman server: " ~ (printer.AFC.spoolman or "not set up (see oc-spoolman.conf)")] %}
  {% for lane in printer.AFC.lanes if lane.startswith('extruder') %}
    {% set l = printer['AFC_lane ' ~ lane] %}
    {% set tool = lane|replace('extruder', '') %}
    {% if l.spool_id %}
      {% set what = "spool %s, %s %s" % (l.spool_id, l.material or '?', l.color or '') %}
    {% else %}
      {% set what = "no spool" %}
    {% endif %}
    {% set _ = out.append("T%s: %s%s" % (tool, what, " (active tool)" if tool|int == active else "")) %}
  {% endfor %}
  {% set _ = out.append("Messages: " ~ ("on" if vars.oc_spoolman_echo|default(1)|int else "off")) %}
  {action_respond_info(out|join("\n"))}

# The echo macro: shows MSG only while messages are on. Usable in your own G-code too,
# for example SPOOLMAN_ECHO MSG="PETG yellow on T0".
[gcode_macro SPOOLMAN_ECHO]
description: Show MSG while Spoolman messages are allowed (SPOOLMAN_ECHO_ON / SPOOLMAN_ECHO_OFF)
gcode:
  {% set vars = printer.save_variables.variables if 'save_variables' in printer else {} %}
  {% if vars.oc_spoolman_echo|default(1)|int %}
    {action_respond_info("Spoolman: " ~ params.MSG|default(''))}
  {% endif %}

[gcode_macro SPOOLMAN_ECHO_ON]
description: enable Spoolman plugin messages (kept across restarts)
gcode:
  SAVE_VARIABLE VARIABLE=oc_spoolman_echo VALUE=1
  {action_respond_info("Spoolman: messages on")}

[gcode_macro SPOOLMAN_ECHO_OFF]
description: Hide routine Spoolman plugin messages. Problems are still shown (kept across restarts)
gcode:
  SAVE_VARIABLE VARIABLE=oc_spoolman_echo VALUE=0
  {action_respond_info("Spoolman: messages off")}

[gcode_macro _SPOOLMAN_PROBLEM]
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=error MSG="Spoolman: {params.MSG|default('')}"
  {% else %}
    {action_raise_error("Spoolman: " ~ params.MSG|default(''))}
  {% endif %}
